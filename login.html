<!DOCTYPE html>
<html lang="en">
<head>
  <title>Cloud Kiss Beauty — Login</title>
 <link rel="stylesheet" href="style.css">
 </head>
<body>

<header>
  <div class="logo">☁️ Cloud Kiss Beauty</div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="product.html">Products</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html">Contact Us</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="login.html" style="background:rgba(255,255,255,0.25); border-radius:25px;">🔑 Login</a></li>
    </ul>
  </nav>
</header>

<main class="login-container">
  <div class="login-box">
    <!-- Your Logo Display -->
    <div class="logo-display"></div>

    <h2>Welcome Back! 💖</h2>
    <p class="subtitle">Sign in to your Cloud Kiss Beauty account</p>

    <form action="#" method="post">
      <label for="username">Email Address</label>
      <input type="email" id="username" name="username" required placeholder="your@email.com">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="Enter your password">

      <div style="text-align:left; margin:0.5rem 0 1rem;">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember" style="display:inline; font-weight:normal;"> Remember Me</label>
      </div>

      <button type="submit" class="btn">✨ Sign In</button>
      <button type="reset" class="btn" style="background:linear-gradient(90deg, #d8b3c4, #e8c5d5); color:var(--text-dark);">Clear</button>
    </form>

    <div class="extra-links">
      <p><a href="#">Forgot Password?</a></p>
      <p>Don't have an account? <a href="#">Sign Up</a></p>
    </div>

    <a href="index.html" class="back-home">← Back to Home Page</a>
  </div>
</main>

<footer>
  <p>&copy; 2026 Cloud Kiss Beauty — All Shades of Pink. Made with 💖</p>
</footer>

</body>
</html>
